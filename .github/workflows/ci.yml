name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --- repository-specific steps (GPU/Playwright, package-content check, size budget, workflow tests) ---
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Install software Vulkan driver (lavapipe) for node-webgpu
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: pnpm build
      - name: Verify published packages include dist
        run: |
          for pkg in core cli; do
            entry=$(cd "packages/$pkg" && pnpm pack --dry-run 2>&1 | grep -m1 -E '^dist/(index|cli)\.js$')
            if [ -z "$entry" ]; then
              echo "::error::dist entry point missing from the packed tarball for packages/$pkg; the publish step would ship a broken package."
              exit 1
            fi
          done
      - run: pnpm tsc
      - run: pnpm lint
      - name: Check formatting
        run: pnpm exec oxfmt --check .
      - run: pnpm test
      - name: Workflow tests
        run: pnpm test:workflow
      - name: Package size budgets
        run: |
          pnpm size | tee package-size.txt
          cat package-size.txt >> "$GITHUB_STEP_SUMMARY"
      # --- end repository-specific steps ---
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - name: Flag audit findings
        if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit found vulnerabilities or could not reach the registry. Review the audit step.'
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
