name: ci

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Install software Vulkan driver (lavapipe) for node-webgpu
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm tsc

      - name: Lint
        run: pnpm lint

      - name: Test
        run: |
          pnpm --filter webgpu-bench-core exec vitest run --project node --project browser-chromium
          pnpm --filter webgpu-bench test

  webkit:
    runs-on: macos-latest
    timeout-minutes: 15
    # GitHub-hosted macOS runners have no Metal GPU access (no software
    # fallback like lavapipe/WARP exists for WebKit's WebGPU backend either),
    # so "no adapter"/hangs here are an infra gap, not a code regression:
    # https://github.com/actions/runner-images/issues/7085
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright WebKit
        run: pnpm exec playwright install webkit

      - name: Test WebKit with WebGPU
        run: pnpm --filter webgpu-bench-core test:webkit
