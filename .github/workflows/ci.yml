name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.26.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Install software Vulkan driver (lavapipe) for node-webgpu
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm tsc

      - name: Lint
        run: pnpm lint

      - name: Test
        run: |
          pnpm test

      - name: Workflow tests
        run: pnpm test:workflow

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Package size budgets
        run: |
          pnpm size | tee package-size.txt
          cat package-size.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Publish coverage percentage
        if: success() && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info

  webkit:
    runs-on: macos-latest
    timeout-minutes: 15
    # GitHub-hosted macOS runners have no Metal GPU access (no software
    # fallback like lavapipe/WARP exists for WebKit's WebGPU backend either),
    # so "no adapter"/hangs here are an infra gap, not a code regression:
    # https://github.com/actions/runner-images/issues/7085
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.26.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright WebKit
        run: pnpm exec playwright install webkit

      - name: Test WebKit with WebGPU
        run: pnpm --filter webgpu-bench-core test:webkit
