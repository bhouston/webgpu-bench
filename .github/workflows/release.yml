name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (verify without publishing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch on main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Release must be dispatched with --ref main (got ${{ github.ref }})."
            exit 1
          fi
  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.26.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run release ${{ inputs.dry_run && '-- --dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
